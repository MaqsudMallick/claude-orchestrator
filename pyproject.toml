[project]
name = "claude-orchestrator"
version = "0.1.0"
description = "Run a DAG of Claude tasks in parallel, without giving up clarifying questions."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "claude-agent-sdk>=0.2.166",
    # LangGraph executes the task DAG; it is not used as an LLM framework here.
    "langgraph>=1.2",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "anyio>=4.0",
    # Parses and wraps markdown for the live body; curses still does the drawing.
    "rich>=13.0",
    # richtext.py reparses with raw HTML disabled; rich depends on it anyway.
    "markdown-it-py>=2.2",
]

[project.scripts]
orchestrator = "orchestrator.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["orchestrator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["orchestrator", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.13"
packages = ["orchestrator"]
strict = true
